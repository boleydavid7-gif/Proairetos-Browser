# Vela: sharing spaces, folders, split views and boosts would upload them to Zen's share server, so it is off
# and its address never resolves. zen.share.enabled turns the Share entries back on (with a server of your own).
- name: zen.share.enabled
  value: false

- name: zen.share.base-url
  value: "https://share.vela.invalid"

- name: zen.share.secret-key
  value: ""

- name: zen.share.display-name
  value: ""

# Allow zen.share.display-name to be synced across devices.
- name: services.sync.prefs.sync.zen.share.display-name
  value: true

- name: zen.share.dont-ask-before-sharing
  value: false
